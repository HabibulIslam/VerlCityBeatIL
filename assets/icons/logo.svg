<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="100%" stop-color="#0E1E38" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="100%" stop-color="#2D5A9E" />
    </linearGradient>
  </defs>

  <!-- Circular Emblem with Detroit Skyline -->
  <g transform="translate(6, 6)">
    <!-- Outer Glow / Ring -->
    <circle cx="34" cy="34" r="34" fill="url(#skyGrad)" />
    <circle cx="34" cy="34" r="31" fill="#0C1B33" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Stylized Sunrise Rays / Pulse (Beat of the City) -->
    <path d="M14 42 Q 34 26 54 42" stroke="rgba(229,193,88,0.3)" stroke-width="1.5" fill="none" />
    <circle cx="34" cy="20" r="10" fill="#E5C158" opacity="0.25" />

    <!-- Detroit Skyline Silhouette -->
    <!-- Renaissance Center central tower & towers -->
    <rect x="31.5" y="14" width="5" height="30" fill="#E5C158" rx="1.5" />
    <polygon points="34,10 32,14 36,14" fill="#E5C158" />
    <rect x="27" y="20" width="4.5" height="24" fill="#C59B27" />
    <rect x="36.5" y="20" width="4.5" height="24" fill="#C59B27" />
    
    <!-- Flanking towers (Penobscot, Ally Detroit, Guardian) -->
    <polygon points="21,21 23,24 23,44 19,44 19,24" fill="#A87F18" />
    <rect x="23.5" y="26" width="3.5" height="18" fill="#C59B27" opacity="0.9" />
    <rect x="41" y="24" width="4" height="20" fill="#C59B27" opacity="0.9" />
    <polygon points="48,27 46,29 46,44 50,44 50,29" fill="#A87F18" />
    <rect x="15" y="32" width="4" height="12" fill="#7D5F10" />
    <rect x="50" y="31" width="4" height="13" fill="#7D5F10" />

    <!-- Soundwave / Heartbeat Accent (City Beat) -->
    <path d="M8 44 L20 44 L24 40 L28 47 L34 38 L40 47 L44 41 L48 44 L60 44" 
          stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Water / Foundation Base -->
    <path d="M12 48 Q 34 53 56 48" stroke="url(#goldGrad)" stroke-width="2" fill="none" />
  </g>

  <!-- Typography -->
  <g transform="translate(86, 12)">
    <text x="0" y="27" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0C1B33" letter-spacing="-0.5">
      CITY <tspan fill="#C59B27">BEAT</tspan>
    </text>
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#4A5568" letter-spacing="2.6">
      INDEPENDENT LIVING, LLC
    </text>
    <text x="0" y="57" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="500" fill="#718096" letter-spacing="1.2">
      A HOUSE OF JENNIFER, INC. PROGRAM • DETROIT, MI
    </text>
  </g>
</svg>
